[project]
name = "bg-city-cost-tracker"
version = "0.1.0"
description = "Data engineering pipeline tracking city housing, fuel prices, and salary affordability in Bulgaria"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]